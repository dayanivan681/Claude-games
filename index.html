<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claude Games</title>
<meta name="theme-color" content="#0a0c1c">
<style>
:root { --bg: #0a0c1c; --ink: #ffffff; --muted: #a9b2da; --gold: #ffd23f; --card: #151936; color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; place-items: center;
  padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
main { width: 100%; max-width: 640px; display: grid; gap: 20px; }
h1 { margin: 0; font-size: 28px; letter-spacing: 0.04em; color: var(--gold); text-align: center; }
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
a.game {
  display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: center;
  padding: 14px; border-radius: 18px; background: var(--card); color: inherit; text-decoration: none;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
a.game:focus-visible, a.game:hover { border-color: var(--gold); outline: none; }
a.game img { width: 72px; height: 72px; border-radius: 16px; image-rendering: pixelated; }
a.game b { display: block; font-size: 19px; }
a.game span { display: block; color: var(--muted); font-size: 14px; line-height: 1.35; margin-top: 4px; }
p { margin: 0; color: var(--muted); font-size: 13px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>Claude Games</h1>
  <div class="games">
    <a class="game" href="slugger/">
      <img src="slugger/icons/icon-192.png" alt="">
      <div><b>Slugger</b><span>Run-and-gun estilo Metal Slug: armas, rehenes, tanque y jefes.</span></div>
    </a>
    <a class="game" href="bomberman/">
      <img src="bomberman/icons/icon-192.png?v=2" alt="">
      <div><b>Bomblast</b><span>Bombas, laberintos y batallas contra la CPU.</span></div>
    </a>
  </div>
  <p>En el iPhone: abre un juego en Safari → Compartir → Agregar a inicio.</p>
</main>
</body>
</html>
