}
html, body { height: 100%; }
body {

  padding-left: max(0px, env(safe-area-inset-left, 0px));

<script>window.SLUGGER_APP = true;</script>
<script>
(() => {
"use strict";
// ---------- Core constants ----------
const W = 436, H = 200, GROUND = 34, LEVEL = 3300, GRAV = -820;
const HS_KEY = "slugger.highscore";
const FONT = '"Press Start 2P", Menlo, ui-monospace, monospace';

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const buf = document.createElement("canvas"); buf.width = W; buf.height = H;

function resize() {

const rand = (a, b) => a + Math.random() * (b - a);

const pick = a => a[Math.random() * a.length | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const loadHS = () => { try { return +localStorage.getItem(HS_KEY) || 0; } catch { return 0; } };
const saveHS = v => { try { localStorage.setItem(HS_KEY, String(v)); } catch {} };
const distBox = (x, y, b) => Math.hypot(Math.max(b.x - x, 0, x - (b.x + b.w)), Math.max(b.y - y, 0, y - (b.y + b.h)));
const inBox = (b, x, y, r = 0) => x >= b.x - r && x <= b.x + b.w + r && y >= b.y - r && y <= b.y + b.h + r;
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => clamp(Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k), 0, 255);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;

// ---------- Audio (synthesized) ----------
let ac = null, master = null, musicGain = null, noiseBuf = null;
let muted = false;
try { muted = localStorage.getItem("slugger.muted") === "1"; } catch {}
function initAudio() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
    musicGain = ac.createGain(); musicGain.gain.value = 0.2; musicGain.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch { ac = null; }
}
function noise(dur, freq, q, vol, type = "bandpass", t0 = 0, dest) {
  if (!ac) return;
  const t = ac.currentTime + Math.max(0, t0);
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const gn = ac.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(gn); gn.connect(dest || master);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function tone(type, f0, f1, dur, vol, t0 = 0, dest) {
  if (!ac) return;
  const t = ac.currentTime + Math.max(0, t0);
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
  const gn = ac.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(gn); gn.connect(dest || master); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  pistol() { noise(0.08, 2400, 1, 0.35); tone("square", 420, 120, 0.06, 0.1); },
  hmg() { noise(0.05, 1700, 0.8, 0.3); tone("square", 300, 90, 0.04, 0.08); },
  shotgun() { noise(0.35, 900, 0.6, 0.8, "lowpass"); tone("sawtooth", 180, 40, 0.22, 0.2); },
  rocket() { noise(0.4, 600, 0.5, 0.35); tone("sawtooth", 200, 600, 0.25, 0.06); },
  flame() { noise(0.4, 500, 0.4, 0.45, "lowpass"); },
  boom(big) { noise(big ? 1.2 : 0.6, big ? 240 : 420, 0.5, big ? 1 : 0.7, "lowpass"); tone("sine", big ? 90 : 130, 30, big ? 0.8 : 0.4, 0.55); },
  cannon() { noise(0.4, 300, 0.7, 0.8, "lowpass"); tone("square", 160, 40, 0.25, 0.2); },
  jump() { tone("square", 220, 520, 0.1, 0.07); },
  pick() { [660, 880, 1320].forEach((f, i) => tone("square", f, f, 0.07, 0.09, i * 0.07)); },
  scream() { const f = rand(480, 720); tone("sawtooth", f, f * 0.35, 0.45, 0.1); tone("square", f * 1.5, f * 0.5, 0.4, 0.035); },
  clink() { tone("triangle", 2200, 1800, 0.06, 0.15); },
  knife() { noise(0.08, 5000, 2, 0.3, "highpass"); },
  die() { tone("sawtooth", 400, 60, 0.7, 0.22); noise(0.5, 800, 0.5, 0.4, "lowpass"); },
  enemyShot() { noise(0.06, 1300, 1, 0.14); },
  thanks() { [784, 1047].forEach((f, i) => tone("square", f, f, 0.09, 0.08, i * 0.1)); },
  toss() { tone("triangle", 300, 700, 0.12, 0.08); },
  tick() { tone("square", 1200, 1200, 0.04, 0.06); },

function say(text) {
  if (muted) return;

    u.lang = "en-US"; u.rate = 0.95; u.pitch = 0.4; u.volume = 1;

}
function vibrate(ms) { try { navigator.vibrate?.(ms); } catch {} }
function setMuted(m) {

// Military march loop (eighth notes)
const BASS = ["A2",0,"A2","A2","C3",0,"A2",0,"G2",0,"G2","G2","E2",0,"G2",0,"F2",0,"F2","F2","A2",0,"F2",0,"E2",0,"E2","G#2","E2",0,"E2",0];
const LEAD = ["A4",0,"E5",0,"D5","C5","B4",0,"C5",0,"D5",0,"E5",0,0,0,"F5",0,"E5","D5","C5",0,"A4",0,"B4",0,"G#4",0,"E4",0,0,0];
const LEAD_B = ["E5","E5",0,"E5","F5",0,"E5",0,"D5","D5",0,"D5","E5",0,"C5",0,"A4","A4",0,"C5","D5",0,"E5",0,"G#4",0,"B4",0,"E5",0,"E5",0];
const nf = n => { const m = n.match(/^([A-G])(#?)(\d)$/); const s = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] ? 1 : 0); return 440 * Math.pow(2, (s + 12 * (+m[3] + 1) - 69) / 12); };
let musicOn = false, nextNote = 0, mStep = 0;
function musicTick() {
  if (!ac || !musicOn || paused) return;
  const fast = !!boss;
  const step = 60 / (fast ? 172 : 150) / 2;
  if (nextNote < ac.currentTime) nextNote = ac.currentTime + 0.05;
  while (nextNote < ac.currentTime + 0.15) {
    const t = nextNote - ac.currentTime, i = mStep % 32;
    const lead = fast ? LEAD_B : LEAD;
    if (BASS[i]) tone("triangle", nf(BASS[i]), nf(BASS[i]), step * 0.9, 0.55, t, musicGain);
    if (lead[i]) tone("square", nf(lead[i]), nf(lead[i]), step * 0.75, 0.12, t, musicGain);
    if (i % 4 === 0) tone("sine", 130, 40, 0.12, 0.6, t, musicGain);
    if (i % 4 === 2) noise(0.09, 1800, 0.7, 0.35, "bandpass", t, musicGain);
    if (i % 2 === 1) noise(0.03, 7000, 1, 0.12, "highpass", t, musicGain);
    nextNote += step; mStep++;
  }
}

// ---------- Themes ----------
const THEMES = [
  { name: "DESIERTO", sky: ["#f08a4b", "#ffd9a0"], sun: "#fff1c4", far: "#d2935e", far2: "#b9774a", mid: "#9c6644", midWin: "#4e2c1e",

  { name: "SELVA", sky: ["#4f9c94", "#cfe8b0"], sun: "#fffbe0", far: "#6a9a72", far2: "#527e5c", mid: "#3e6442", midWin: "#24402a",
    near: "#2c5426", trunk: "#4a3520", ground: "#6b5a34", groundTop: "#7ea43c", dirt: "#54452a", deco: "jungle", weather: "leaves", wall: "#7d7c64", wallD: "#4a4a3a", wallTop: "#8aa83a", boss: "#566a3e", bossName: "MANTIS BLINDADA" },
  { name: "NIEVE", sky: ["#141b38", "#4d6898"], sun: "#e8eeff", far: "#7f90b8", far2: "#62729a", mid: "#46527a", midWin: "#ffd36a",
    near: "#203242", trunk: "#3a2a24", ground: "#d4dcea", groundTop: "#ffffff", dirt: "#9aa8c0", deco: "pine", weather: "snow", wall: "#6a4a3a", wallD: "#3e2a20", wallTop: "#ffffff", boss: "#5f7080", bossName: "OSO POLAR MK-II" },

// ---------- Palettes ----------

const PAL_E = { skin: "#e2b080", hair: "#3a2a1a", hat: "#5f6b2e", hatD: "#46511f", top: "#7d8a42", topD: "#5c6830", pants: "#6b7738", pantsD: "#4f5a28", boot: "#2a2418", belt: "#3a3020", gun: "#333338", gunL: "#666670", eye: "#1a1010" };

const PAL_W = Object.fromEntries(Object.keys(PAL_P).map(k => [k, "#ffffff"]));
const PAL_BURN = Object.fromEntries(Object.keys(PAL_P).map(k => [k, "#1c1210"]));
const HEROES = [
  { name: "RAYO", id: "pistol", perk: "PISTOLA DOBLE", pal: PAL_P, hat: "band" },
  { name: "TANIA", id: "ammo", perk: "MUNICIÓN +50%", pal: { ...PAL_P, skin: "#e8b080", hair: "#2a1a14", hat: "#3a8a3a", hatD: "#2a6a2a", top: "#5a7a3a", topD: "#3e5a28", pants: "#7a6a4a", pantsD: "#5a4e36" }, hat: "pony" },
  { name: "ERIKA", id: "bombs", perk: "20 GRANADAS", pal: { ...PAL_P, skin: "#f6cfa0", hair: "#f0d060", hat: "#3a5aa8", hatD: "#2a4080", top: "#d8d0b8", topD: "#aaa290", pants: "#4a6a3a", pantsD: "#344c28" }, hat: "cap" },
  { name: "FITO", id: "speed", perk: "MÁS RÁPIDO", pal: { ...PAL_P, hair: "#3a2414", hat: "#c8a45a", hatD: "#94743a", top: "#8a6a3a", topD: "#64482a", pants: "#3a4a6a", pantsD: "#2a364e" }, hat: "cap", glasses: true },
];
let heroIdx = 0;
try { heroIdx = clamp(+localStorage.getItem("slugger.hero") || 0, 0, 3); } catch {}
let hero = HEROES[heroIdx];
const startBombs = () => hero.id === "bombs" ? 20 : 10;
const CARD = i => ({ x: 26 + i * 98, y: 40, w: 88, h: 118 });

// ---------- Weapons ----------
const WEAPONS = {
  P: { name: "PISTOLA", cd: 0.17, ammo: Infinity },
  H: { name: "HEAVY MACHINE GUN", cd: 0.065, ammo: 200, voice: "Heavy machine gun!" },
  R: { name: "ROCKET LAUNCHER", cd: 0.42, ammo: 30, voice: "Rocket launcher!" },
  F: { name: "FLAME SHOT", cd: 0.38, ammo: 30, voice: "Flame shot!" },

const ITEM_COLORS = { H: "#ffd34d", R: "#ff7a4a", F: "#ffa02a", S: "#7ad0ff", B: "#8ae06a" };

// ---------- State ----------
let state = "title", stateT = 0, clock = 0;
let mission = 1, loop = 0, theme = THEMES[0];
let camX = 0, idleCam = 0, shake = 0;
let P, tank, boss, enemies = [], bullets = [], items = [], pows = [], crates = [], barrels = [];
let parts = [], booms = [], corpses = [], popups = [], blasts = [], placed = [], props = [];
let locks = [], lock = null, bossDone = false, trickle = 3;
let score = 0, lives = 2, credits = 0, timeLeft = 60, timeAcc = 0, powSaved = 0, missionPows = 0;
let banner = null, announceMsg = null, goT = 0, contT = 0;
let highScore = loadHS();
let far = [], far2 = [], mids = [], nears = [], flakes = [];
let skyGrad = null;
let plats = [], paused = false, slowT = 0;
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function mkPlayer(x, y = GROUND) {
  return { x, y, vx: 0, vy: 0, face: 1, onGround: y <= GROUND, crouch: false, aim: "f", moving: false, runT: 0,
    weapon: "P", ammo: Infinity, bombs: startBombs(), fireCD: 0, dropT: 0, shootT: 0, knifeT: 0, throwT: 0, inv: 0,
    dead: false, deadT: 0, inTank: false, enterCD: 0 };

function buildBackdrop() {
  far = []; for (let x = 0; x < LEVEL * 0.12 + W + 60; x += 20) far.push(rand(30, 80));
  far2 = []; for (let x = 0; x < LEVEL * 0.2 + W + 60; x += 14) far2.push(rand(14, 40));

function setupMission() {
  theme = THEMES[(mission - 1) % 3]; loop = Math.floor((mission - 1) / 3);
  camX = 0; idleCam = 0; shake = 0;
  enemies = []; bullets = []; items = []; pows = []; crates = []; barrels = [];
  parts = []; booms = []; corpses = []; popups = []; blasts = []; placed = [];
  boss = null; bossDone = false; lock = null; trickle = 3; missionPows = 0;
  buildBackdrop();
  // Rooftops: one-way ledges on ruined buildings, often with a sniper squad on top.
  plats = [];

  P = mkPlayer(60);
  timeLeft = 60; timeAcc = 0;
  banner = { title: `MISIÓN ${mission}`, sub: theme.name + (loop ? `  ·  NIVEL ${loop + 1}` : ""), t: 0, dur: 3.2 };
  say(`Mission ${mission}. Start!`);
}

function makeWaves(k) {
  const n = 2 + loop;
  const sq = (cnt, side, para, types) => Array.from({ length: cnt }, (_, i) => ({ type: types ? pick(types) : pickType(), side, para, delay: i * 0.55 }));
  if (k === 0) return [sq(n + 1, "r"), [{ type: "truck", side: "r", delay: 0 }], sq(n, "l"), sq(n + 1, "r", true)];
  return [[{ type: "heli", side: "r", delay: 0 }], sq(n + 1, "r"), [...sq(n, "l", false, ["bazooka", "rifle"]), ...sq(2, "r", true)]];
}

function addCrate(x, y) { crates.push({ x, y, w: 16, h: 16, vy: 0, hp: 4, flash: 0, item: Math.random() < 0.55 ? randItem() : null }); }
function addBarrel(x) { barrels.push({ x, y: GROUND, w: 12, h: 16, hp: 3, flash: 0, fuse: 0, dead: false }); }
function randItem() { const r = Math.random(); return r < 0.3 ? "H" : r < 0.45 ? "R" : r < 0.6 ? "F" : r < 0.75 ? "S" : r < 0.9 ? "B" : "food"; }
function pickType() { const r = Math.random(); return r < 0.36 ? "rifle" : r < 0.54 ? "knife" : r < 0.7 ? "grenadier" : r < 0.86 ? "bazooka" : "shield"; }

function mkEnemy(type, x, o = {}) {
  const hpBase = { rifle: 1, knife: 1, grenadier: 1, bazooka: 2, shield: 2, heli: 12, truck: 22 }[type];

    wave: !!o.wave, idleKind: o.idle ? pick(["chat", "chat", "sleep"]) : null, t: 0, baseY: 150, plat: o.plat || null, panic: 0 };
  if (type === "truck") { e.stopX = camX + W - 74; e.unload = 3 + loop; e.unT = 0.6; }
  if (type === "heli") { e.y = 150; e.cd = 2; }
  if (e.idleKind === "sleep") e.crouch = true;
  enemies.push(e);
  return e;
}
const SCORES = { rifle: 100, knife: 100, grenadier: 150, bazooka: 200, shield: 300, heli: 1000, truck: 800 };

function startGame() {
  initAudio();
  mission = 1; score = 0; lives = 2; credits = 0; powSaved = 0;

// ---------- Input ----------
const KEYMAP = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyJ: "fire", KeyZ: "fire", KeyK: "jump", KeyX: "jump", Space: "jump", KeyL: "gren", KeyC: "gren" };
const BTN = {
  fire: { x: W - 44, y: H - 46, r: 25, label: "FUEGO" },
  jump: { x: W - 100, y: H - 24, r: 19, label: "SALTO" },
  gren: { x: W - 98, y: H - 76, r: 16, label: "BOMBA" },
};
const keys = new Set();
const btnPointers = new Map();
let stick = null, touchUI = matchMedia("(pointer: coarse)").matches;
const input = { left: false, right: false, up: false, down: false, fire: false, jump: false, gren: false, jumpPressed: false, grenPressed: false };
let prevJump = false, prevGren = false;

function toLogical(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
function btnAt(p) {
  let best = null, bd = Infinity;
  for (const [n, b] of Object.entries(BTN)) { const d = Math.hypot(p.x - b.x, p.y - b.y); if (d < b.r * 1.4 && d < bd) { best = n; bd = d; } }
  if (!best && p.x > W * 0.55) best = "fire";
  return best;
}
const onMute = p => p.x > W - 26 && p.y < 22;
const onPause = p => p.x > W - 50 && p.x <= W - 26 && p.y < 22;
const playing = () => state === "play" || state === "complete";
function toSelect() { initAudio(); state = "select"; stateT = 0; sfx.pick(); }
function chooseHero(i) {
  heroIdx = i; hero = HEROES[i];
  try { localStorage.setItem("slugger.hero", String(i)); } catch {}
  startGame();
}
function setPaused(v) { paused = v; keys.clear(); btnPointers.clear(); stick = null; }
document.addEventListener("visibilitychange", () => { if (document.hidden && playing()) setPaused(true); });

canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  if (e.pointerType === "touch") touchUI = true;
  initAudio();
  const p = toLogical(e);
  if (onMute(p)) { setMuted(!muted); return; }
  if (paused) { setPaused(false); return; }
  if (playing() && onPause(p)) { setPaused(true); return; }
  if (state === "title") return toSelect();
  if (state === "select") {
    for (let i = 0; i < 4; i++) { const c = CARD(i); if (p.x > c.x && p.x < c.x + c.w && p.y > c.y && p.y < c.y + c.h) return chooseHero(i); }
    return;
  }
  if (state === "continue") return doContinue();
  if (state === "over") { if (stateT > 1) { state = "title"; stateT = 0; } return; }
  canvas.setPointerCapture?.(e.pointerId);
  if (p.x < W * 0.45) { stick = { id: e.pointerId, ox: p.x, oy: p.y, x: p.x, y: p.y }; return; }
  btnPointers.set(e.pointerId, btnAt(p));
});
canvas.addEventListener("pointermove", e => {
  const p = toLogical(e);
  if (stick && stick.id === e.pointerId) {
    stick.x = p.x; stick.y = p.y;
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy, d = Math.hypot(dx, dy);
    if (d > 26) { stick.ox = stick.x - dx / d * 26; stick.oy = stick.y - dy / d * 26; }
  } else if (btnPointers.has(e.pointerId)) btnPointers.set(e.pointerId, btnAt(p));
});
const release = e => { if (stick && stick.id === e.pointerId) stick = null; btnPointers.delete(e.pointerId); };
canvas.addEventListener("pointerup", release);
canvas.addEventListener("pointercancel", release);

window.addEventListener("keydown", e => {
  if (e.code === "KeyM") { setMuted(!muted); return; }
  if ((e.code === "KeyP" || e.code === "Escape") && playing()) { setPaused(!paused); return; }
  if (paused) { if (e.code === "Enter") setPaused(false); return; }
  const k = KEYMAP[e.code];
  if (!k && e.code !== "Enter") return;
  e.preventDefault(); initAudio();
  if (state === "title") { if (!e.repeat) toSelect(); return; }
  if (state === "select") {
    if (e.repeat) return;
    if (k === "left" || k === "right") { heroIdx = (heroIdx + (k === "left" ? 3 : 1)) % 4; hero = HEROES[heroIdx]; sfx.tick(); }
    else if (stateT > 0.25) chooseHero(heroIdx);
    return;
  }
  if (state === "continue") { if (!e.repeat) doContinue(); return; }
  if (state === "over") { if (stateT > 1) { state = "title"; stateT = 0; } return; }
  if (k) keys.add(k);
});
window.addEventListener("keyup", e => { const k = KEYMAP[e.code]; if (k) keys.delete(k); });
window.addEventListener("blur", () => { keys.clear(); btnPointers.clear(); stick = null; });

function readInput() {
  const b = new Set(btnPointers.values());
  let l = keys.has("left"), r = keys.has("right"), u = keys.has("up"), d = keys.has("down");
  if (stick) {
    const dx = stick.x - stick.ox, dy = stick.oy - stick.y;
    if (Math.hypot(dx, dy) > 7) {
      const a = Math.atan2(dy, dx), c = Math.cos(a), s = Math.sin(a);
      l ||= c < -0.38; r ||= c > 0.38; u ||= s > 0.55; d ||= s < -0.55;
    }
  }
  input.left = l; input.right = r; input.up = u; input.down = d;
  input.fire = keys.has("fire") || b.has("fire");
  input.jump = keys.has("jump") || b.has("jump");
  input.gren = keys.has("gren") || b.has("gren");
  input.jumpPressed = input.jump && !prevJump; prevJump = input.jump;
  input.grenPressed = input.gren && !prevGren; prevGren = input.gren;
}

// ---------- Effects ----------
function part(x, y, vx, vy, life, c, s = 2, gr = 0, kind = "sq") { parts.push({ x, y, vx, vy, life, max: life, c, s, g: gr, kind }); }
function sparks(x, y, n, c, sp) { for (let i = 0; i < n; i++) { const a = rand(0, 6.283), v = rand(0.3, 1) * sp; part(x, y, Math.cos(a) * v, Math.sin(a) * v, rand(0.2, 0.45), c, Math.random() < 0.5 ? 1 : 2, -300); } }
function smoke(x, y, n, s = 4) { for (let i = 0; i < n; i++) part(x + rand(-5, 5), y + rand(-4, 6), rand(-12, 12), rand(10, 32), rand(0.6, 1.2), pick(["#5a5550", "#6e6862", "#47423e"]), s, 0, "smoke"); }
function debris(x, y, n, c) { for (let i = 0; i < n; i++) part(x, y, rand(-90, 90), rand(60, 200), rand(0.5, 0.9), c, ri(2, 3), GRAV * 0.8, "deb"); }
function muzzle(x, y) { part(x, y, 0, 0, 0.06, "#fff3a0", 6, 0, "flash"); }
function popup(x, y, text, c = "#fff") { popups.push({ x, y, text, c, t: 0 }); }
function announce(text) { announceMsg = { text, t: 0 }; }
function boom(x, y, size) {
  const blobs = [];
  const n = 3 + Math.round(size * 3);
  for (let i = 0; i < n; i++) blobs.push({ dx: rand(-1, 1) * size * 7, dy: rand(0, 1) * size * 9, r: rand(5, 9), d: i === 0 ? 0 : rand(0, 0.16) });
  booms.push({ x, y, t: 0, dur: 0.45 + size * 0.1, size, blobs });
}
function explode(x, y, R, dmg, team, size = 1) {
  boom(x, y, size); sfx.boom(size > 1.6); shake = Math.max(shake, 1.5 + size * 1.6);
  smoke(x, y + 6, 2 + Math.round(size * 2), 4); sparks(x, y + 4, 6 + size * 3, "#ffd34d", 170);
  if (size > 1.5) vibrate(40);
  if (team === "p") {
    for (const e of enemies) {
      if (e.dead) continue;
      const d = distBox(x, y, ebox(e));
      if (d < R) damageEnemy(e, dmg, "boom", x);
      else if (d < R + 36 && !e.plat && e.type !== "heli" && e.type !== "truck" && e.state === "act" && Math.random() < 0.5) e.panic = 0.8;
    }
    if (boss && !boss.dying && !boss.enter && distBox(x, y, bossBox()) < R) damageBoss(dmg);
    for (const c of crates) if (!c.dead && distBox(x, y, c) < R) damageCrate(c, dmg);
    for (const b of barrels) if (!b.dead && distBox(x, y, b) < R) damageBarrel(b, dmg);
  } else if (team === "e") {
    if (P.inTank) { if (distBox(x, y, tankBox()) < R) damageTank(); }
    else if (!P.dead && distBox(x, y, pBox()) < R) killPlayer();
  }
}

// ---------- Hit boxes ----------
function ebox(e) {
  if (e.type === "heli") return { x: e.x - 15, y: e.y - 9, w: 30, h: 17 };
  if (e.type === "truck") return { x: e.x - 28, y: e.y, w: 56, h: 30 };
  return { x: e.x - 5, y: e.y, w: 10, h: e.crouch ? 14 : 21 };
}
const pBox = () => ({ x: P.x - 4, y: P.y, w: 8, h: P.crouch ? 13 : 20 });
const tankBox = () => ({ x: tank.x - 20, y: tank.y, w: 40, h: 30 });
function bossBox() {
  if (boss.kind === "walker") return { x: boss.x - 32, y: boss.y + 4, w: 64, h: 70 };
  if (boss.kind === "bomber") return { x: boss.x - 56, y: boss.y - 12, w: 112, h: 26 };
  return { x: boss.x + 2, y: GROUND, w: 146, h: 86 };
}
const powBox = p => ({ x: p.x - 5, y: p.y, w: 10, h: 15 });
function targetPos() {
  if (P.inTank && tank) return { x: tank.x, y: tank.y + 15 };
  return { x: P.x, y: P.y + (P.crouch ? 8 : 12) };
}

// ---------- Damage ----------
function damageEnemy(e, dmg, kind, fromX) {
  if (e.dead) return false;
  if (e.type === "shield" && e.shield > 0 && kind === "bullet" && Math.sign(fromX - e.x) === e.face) {
    e.shield -= dmg; sfx.clink(); sparks(e.x + e.face * 8, e.y + 12, 3, "#ffffff", 90);
    if (e.shield <= 0) { debris(e.x + e.face * 8, e.y + 12, 6, "#9aa4ae"); popup(e.x, e.y + 26, "¡ESCUDO ROTO!", "#7ad0ff"); }
    return true;
  }
  if (e.state === "idle") { e.state = "alert"; e.alertT = 0.25; }
  e.hp -= dmg; e.flash = 0.08;
  if (e.hp <= 0) killEnemy(e, kind);
  return true;
}
function killEnemy(e, kind) {
  e.dead = true;
  const pts = SCORES[e.type] * (1 + loop);
  score += pts; popup(e.x, e.y + (e.type === "heli" ? 10 : 26), String(pts));
  if (e.type === "truck") { explode(e.x, e.y + 14, 40, 10, "p", 2.6); debris(e.x, e.y + 14, 16, "#4a5528"); return; }
  if (e.type === "heli") { corpses.push({ kind: "heli", x: e.x, y: e.y, vx: e.face * 30, vy: 0, t: 0, face: e.face, rot: 0 }); sfx.boom(false); return; }
  if (Math.random() < 0.75) sfx.scream();
  const ck = kind === "boom" ? "fly" : kind === "flame" ? "burn" : "fall";
  corpses.push({ kind: ck, x: e.x, y: e.y, vx: (ck === "fly" ? -e.face * rand(40, 90) : -e.face * 30), vy: ck === "fly" ? rand(160, 240) : 0, t: 0, face: e.face, rot: 0, type: e.type });
  if (Math.random() < 0.06) dropItem(e.x, e.y + 10, randItem());
}
function damageBoss(dmg) {
  if (!boss || boss.dying || boss.enter) return;
  boss.hp -= dmg; boss.flash = 0.06;
  if (boss.hp <= 0) { boss.dying = true; boss.dieT = 0; boss.boomT = 0; slowT = 1.1; say("Great!"); }
}
function damageCrate(c, d) {
  c.hp -= d; c.flash = 0.06;
  if (c.hp <= 0 && !c.dead) {
    c.dead = true; debris(c.x + 8, c.y + 8, 10, "#a8743a"); debris(c.x + 8, c.y + 8, 4, "#6a4520");
    if (c.item) dropItem(c.x + 8, c.y + 4, c.item);
    score += 50;
  }
}
function damageBarrel(b, d) { b.hp -= d; b.flash = 0.06; if (b.hp <= 0 && !b.fuse) b.fuse = 0.12; }
function damageTank() {
  if (!tank || tank.state !== "driven" || tank.flash > 0) return;
  tank.hp--; tank.flash = 0.4; shake = Math.max(shake, 3); sfx.clink(); sfx.boom(false);
  if (tank.hp <= 0) ejectTank(true);
}
function killPlayer() {
  if (state !== "play" || P.dead || P.inv > 0) return;
  if (P.inTank) ejectTank(true);
  P.dead = true; P.deadT = 0; P.vy = 170; P.vx = -P.face * 45; P.onGround = false;
  sfx.die(); shake = Math.max(shake, 4); vibrate(120);
  sparks(P.x, P.y + 12, 10, "#ffffff", 140);
}
function freePow(p) {
  if (p.state !== "tied") return;
  p.state = "free"; p.t = 0; score += 100; powSaved++; missionPows++;
  debris(p.x, p.y + 8, 5, "#c8a060"); popup(p.x, p.y + 22, "100", "#ffd34d");
}

// ---------- Player ----------
function respawn() {
  const bombs = startBombs();
  P = mkPlayer(camX + 60, 175);
  P.onGround = false; P.inv = 2.5; P.bombs = bombs;
  timeLeft = 60; timeAcc = 0;
}
function doContinue() {
  credits++; lives = 2; respawn(); state = "play"; stateT = 0;
  musicOn = true; if (ac) nextNote = ac.currentTime + 0.1;
}

function movePlayerX(dx) {
  P.x += dx;
  for (const c of crates) {
    if (c.dead) continue;
    const top = c.y + c.h;
    if (P.y < top - 1 && P.y + 20 > c.y && P.x + 4 > c.x && P.x - 4 < c.x + c.w) {
      if (dx > 0) P.x = c.x - 4; else if (dx < 0) P.x = c.x + c.w + 4;
    }
  }
}
function floorAt(x, half, prevY, noPlat = false) {
  let f = GROUND;
  if (!noPlat) for (const p of plats) if (x > p.x && x < p.x + p.w && prevY >= p.y - 0.5) f = Math.max(f, p.y);
  for (const c of crates) {
    if (c.dead) continue;
    const top = c.y + c.h;
    if (x + half > c.x && x - half < c.x + c.w && prevY >= top - 0.5) f = Math.max(f, top);
  }
  return f;
}

function updatePlayer(dt) {
  P.inv = Math.max(0, P.inv - dt); P.enterCD = Math.max(0, P.enterCD - dt); P.dropT = Math.max(0, P.dropT - dt);
  if (P.dead) {
    P.deadT += dt; P.x += P.vx * dt; P.vy += GRAV * dt; P.y += P.vy * dt;
    if (P.y <= GROUND) { P.y = GROUND; P.vy = 0; P.vx = 0; }
    if (P.deadT > 1.9) {
      if (lives > 0) { lives--; respawn(); }
      else { state = "continue"; stateT = 0; contT = 9.99; musicOn = false; say("Continue?"); }
    }
    return;
  }
  if (P.inTank) return driveTank(dt);

  P.crouch = input.down && P.onGround;
  P.aim = input.up ? "u" : (input.down && !P.onGround) ? "d" : "f";
  let dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  if (dir) P.face = dir;
  movePlayerX(dir * (P.crouch ? 36 : hero.id === "speed" ? 108 : 92) * dt);
  if (input.jumpPressed && P.onGround) {
    const onRoof = P.y > GROUND + 0.5 && plats.some(p => Math.abs(P.y - p.y) < 0.5 && P.x > p.x && P.x < p.x + p.w);
    if (input.down && onRoof) { P.dropT = 0.3; P.onGround = false; P.vy = -40; }
    else { P.vy = 300; P.onGround = false; sfx.jump(); }
  }
  const prevY = P.y;
  P.vy += GRAV * dt; P.y += P.vy * dt;
  P.onGround = false;
  if (P.vy <= 0) {
    const f = floorAt(P.x, 4, prevY, P.dropT > 0);
    if (P.y <= f) { P.y = f; P.vy = 0; P.onGround = true; }
  }
  let maxX = camX + W - 8;
  if (boss && boss.kind === "tank") maxX = Math.min(maxX, boss.x - 6);
  P.x = clamp(P.x, camX + 6, maxX);
  P.moving = dir !== 0 && P.onGround;
  if (P.moving) P.runT += dt;
  P.fireCD -= dt; P.shootT -= dt; P.knifeT -= dt; P.throwT -= dt;
  if (input.fire && P.fireCD <= 0) shoot();
  if (input.grenPressed) throwGrenade();

  if (tank && tank.state === "parked" && P.enterCD <= 0 && Math.abs(P.x - tank.x) < 14 && P.y < tank.y + 34) {
    P.inTank = true; tank.state = "driven"; tank.face = P.face; tank.flash = 0;
    sfx.pick(); announce("¡SLUG LISTO!"); say("Slug!");
  }
}

function knifeTarget() {
  for (const e of enemies) {
    if (e.dead || e.type === "heli" || e.type === "truck") continue;
    const dx = e.x - P.x;
    if (Math.abs(dx) < 17 && (Math.sign(dx) === P.face || Math.abs(dx) < 6) && Math.abs(e.y - P.y) < 14) return e;
  }
  return null;
}

function addB(o) { bullets.push(Object.assign({ vx: 0, vy: 0, grav: 0, life: 3, dmg: 1, r: 1.5, dead: false, acc: 0, max: 0 }, o)); }

function shoot() {
  const k = P.aim === "f" ? knifeTarget() : null;
  if (k) { P.knifeT = 0.22; P.fireCD = 0.28; sfx.knife(); damageEnemy(k, 3, "cut", P.x); sparks(k.x, k.y + 12, 4, "#ffffff", 80); return; }
  const wpn = WEAPONS[P.weapon];
  P.fireCD = wpn.cd; P.shootT = 0.1;
  let dx = P.face, dy = 0;
  if (P.aim === "u") { dx = 0; dy = 1; } else if (P.aim === "d") { dx = 0; dy = -1; }
  const ox = P.x + (dx ? P.face * 14 : P.face * 1.5);
  const oy = P.y + (dy > 0 ? 28 : dy < 0 ? -2 : (P.crouch ? 10 : 13));
  switch (P.weapon) {
    case "P":
      addB({ kind: "b", team: "p", x: ox, y: oy, vx: dx * 330, vy: dy * 330, life: 1.2, dmg: hero.id === "pistol" ? 2 : 1 });
      sfx.pistol(); break;
    case "H": {
      const j = rand(-0.07, 0.07), sp = 390;
      const vx = dx ? dx * sp * Math.cos(j) : sp * Math.sin(j), vy = dy ? dy * sp * Math.cos(j) : sp * Math.sin(j);
      addB({ kind: "hb", team: "p", x: ox, y: oy + rand(-1, 1), vx, vy, life: 1.2 });
      part(P.x, P.y + 14, -P.face * rand(30, 60), rand(60, 110), 0.5, "#e8c050", 1, GRAV * 0.7, "deb");
      sfx.hmg(); break;
    }
    case "S": {
      blasts.push({ x: ox, y: oy, dx, dy, t: 0 });
      shotgunHit(ox, oy, dx, dy);
      sfx.shotgun(); shake = Math.max(shake, 2); break;
    }
    case "R":
      addB({ kind: "rocket", team: "p", x: ox, y: oy, vx: dx * 90, vy: dy * 90, acc: 520, max: 320, life: 2.2, dmg: 5 });
      sfx.rocket(); break;
    case "F":
      addB({ kind: "flame", team: "p", x: ox, y: oy, vx: dx * 180, vy: dy * 180, life: 0.55, dmg: 2, hits: new Set() });
      sfx.flame(); break;
  }
  muzzle(ox, oy);
  if (P.weapon !== "P" && --P.ammo <= 0) { P.weapon = "P"; P.ammo = Infinity; }
}

function shotgunHit(x, y, dx, dy) {
  const inCone = (cx, cy) => {
    const rx = cx - x, ry = cy - y;
    const along = rx * dx + ry * dy, across = Math.abs(rx * dy - ry * dx);
    return along > -4 && along < 78 && across < 10 + along * 0.38;
  };
  for (const e of enemies) { if (e.dead) continue; const b = ebox(e); if (inCone(b.x + b.w / 2, b.y + b.h / 2)) damageEnemy(e, 6, "shot", x); }
  for (const c of crates) if (!c.dead && inCone(c.x + 8, c.y + 8)) damageCrate(c, 6);
  for (const b of barrels) if (!b.dead && inCone(b.x + 6, b.y + 8)) damageBarrel(b, 6);
  for (const p of pows) if (p.state === "tied" && inCone(p.x, p.y + 7)) freePow(p);
  if (boss && !boss.dying && !boss.enter) { const bb = bossBox(); if (inCone(clamp(x + dx * 40, bb.x, bb.x + bb.w), clamp(y, bb.y, bb.y + bb.h))) damageBoss(6); }
}

function throwGrenade() {
  if (P.dead || P.bombs <= 0) return;
  if (bullets.filter(b => b.kind === "gren").length >= 2) return;
  P.bombs--; P.throwT = 0.25; sfx.toss();
  addB({ kind: "gren", team: "p", x: P.x + P.face * 4, y: P.y + 20, vx: P.face * (150 + (P.moving ? 30 : 0)), vy: 230, grav: GRAV * 0.8, life: 4, dmg: 7 });
}

// ---------- Tank (the Slug) ----------
function ejectTank(destroyed) {
  if (!tank) return;
  P.inTank = false; P.x = tank.x; P.y = tank.y + 30; P.vy = 260; P.onGround = false;
  P.inv = Math.max(P.inv, destroyed ? 1.4 : 0.3); P.enterCD = 1;
  if (destroyed) { tank.state = "doomed"; tank.t = 1.1; announce("¡EL SLUG VA A EXPLOTAR!"); }
  else tank.state = "parked";
}
function driveTank(dt) {
  const t = tank;
  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  if (dir) t.face = dir;
  t.x += dir * 72 * dt; t.tread += dir * dt;
  t.aimUp = input.up;
  if (input.jumpPressed) {
    if (input.down) { ejectTank(false); return; }
    if (t.onGround) { t.vy = 250; t.onGround = false; sfx.jump(); }
  }
  let maxX = camX + W - 22;
  if (boss && boss.kind === "tank") maxX = Math.min(maxX, boss.x - 22);
  t.x = clamp(t.x, camX + 22, maxX);
  P.x = t.x; P.y = t.y; P.face = t.face;
  t.cd -= dt; t.ccd -= dt;
  if (input.fire && t.cd <= 0) {
    t.cd = 0.075;
    const j = rand(-0.06, 0.06);

function updateEnemies(dt) {

// Mantis walker: stalks, leaps onto you (shockwaves on landing) and sweeps a low laser you can crouch under.
function updateWalker(b, dt, tg, spd, p2) {
  const lo = camX + 40, hi = camX + W - 40;

    b.vy += GRAV * dt; b.y += b.vy * dt;
    if (b.y <= GROUND) { b.y = GROUND; b.vy = 0; b.enter = false; landWalker(b); }
    return;
  }
  b.t += dt;
  const dx = tg.x - b.x;
  if (b.mode === "walk") {
    b.face = dx < 0 ? -1 : 1;
    if (Math.abs(dx) > 70) { b.x += b.face * 30 * spd * dt; b.walkT += dt * spd; }
    b.cdC -= dt * spd; b.modeT -= dt * spd;
    if (b.cdC <= 0) { b.mode = "charge"; b.modeT = 0.75; b.cdC = 3.6; tone("sawtooth", 200, 900, 0.7, 0.08); announce("¡AGÁCHATE!"); }
    else if (b.modeT <= 0) { b.mode = "crouch"; b.modeT = 0.45; }
  } else if (b.mode === "charge") {
    b.modeT -= dt;
    if (b.modeT <= 0) { b.mode = "laser"; b.modeT = 0.55; noise(0.55, 3000, 0.5, 0.4, "bandpass"); tone("square", 880, 440, 0.5, 0.1); shake = Math.max(shake, 2); }
  } else if (b.mode === "laser") {
    b.modeT -= dt;
    const beam = laserBox(b);
    if (P.inTank && tank) { if (overlap(beam, tankBox())) damageTank(); }
    else if (!P.dead && overlap(beam, pBox())) killPlayer();
    if (Math.random() < 0.5) sparks(b.face < 0 ? camX + rand(0, b.x - camX - 40) : rand(b.x + 40, camX + W), GROUND + 16, 1, "#ff6a9a", 60);
    if (b.modeT <= 0) { b.mode = "walk"; b.modeT = rand(2.2, 3.6); }
  } else if (b.mode === "crouch") {
    b.modeT -= dt;
    if (b.modeT <= 0) {
      const T = 1.0, tx = clamp(tg.x, lo, hi);

    }

    b.vy += GRAV * dt; b.y += b.vy * dt; b.x += b.vx * dt;

  }
  b.x = clamp(b.x, lo, hi);

function laserBox(b) {

function updateBullets(dt) {
  for (const b of bullets) {
    if (b.dead) continue;
    b.life -= dt;
    if (b.acc) {
      if (b.kind === "rocket") {
        const sp = Math.min(Math.hypot(b.vx, b.vy) + b.acc * dt, b.max);
        let ang = Math.atan2(b.vy, b.vx);
        let best = null, bd = 160;
        for (const e of enemies) {
          if (e.dead) continue;
          const bx = ebox(e), ex = bx.x + bx.w / 2, ey = bx.y + bx.h / 2;
          const d = Math.hypot(ex - b.x, ey - b.y);
          const da = Math.atan2(ey - b.y, ex - b.x) - ang;
          if (d < bd && Math.cos(da) > 0.5) { best = { ex, ey }; bd = d; }
        }
        if (!best && boss && !boss.dying && !boss.enter) {
          const bb = bossBox(), ex = bb.x + bb.w / 2, ey = bb.y + bb.h / 2;
          if (Math.cos(Math.atan2(ey - b.y, ex - b.x) - ang) > 0.3) best = { ex, ey };
        }
        if (best) { let da = Math.atan2(best.ey - b.y, best.ex - b.x) - ang; da = Math.atan2(Math.sin(da), Math.cos(da)); ang += clamp(da, -3 * dt, 3 * dt); }
        b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
        if (Math.random() < 0.6) part(b.x, b.y, rand(-10, 10), rand(-10, 10), 0.35, "#9a948e", 3, 0, "smoke");
      } else {
        b.vx = clamp(b.vx + b.acc * dt, -b.max, b.max);
        if (Math.random() < 0.5) part(b.x, b.y, 0, 8, 0.3, "#9a948e", 3, 0, "smoke");
      }
    }
    if (b.kind === "emissile") {
      const tg = targetPos(), sp = Math.min(Math.hypot(b.vx, b.vy) + 60 * dt, 105);
      let ang = Math.atan2(b.vy, b.vx), da = Math.atan2(tg.y - b.y, tg.x - b.x) - ang;
      da = Math.atan2(Math.sin(da), Math.cos(da)); ang += clamp(da, -1.7 * dt, 1.7 * dt);
      b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
      if (Math.random() < 0.6) part(b.x, b.y, rand(-8, 8), rand(-8, 8), 0.4, "#9a948e", 3, 0, "smoke");
    }
    if (b.kind === "wave" && Math.random() < 0.5) part(b.x, GROUND + 2, -b.vx * 0.1, rand(20, 50), 0.3, theme.groundTop, 2, -200);
    b.vy += b.grav * dt; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.kind === "gren" || b.kind === "egren") b.spin = (b.spin || 0) + dt * 14;
    if (b.kind === "flame") {
      if (Math.random() < 0.8) part(b.x + rand(-3, 3), b.y + rand(-2, 3), b.vx * 0.2, rand(10, 40), 0.25, pick(["#ffd34d", "#ff8a1a", "#ff5a1a"]), 3);
      if (b.y <= GROUND + 2) { b.y = GROUND + 2; b.vy = 0; }
    }
    const explosive = { gren: [26, 7, 1.3], rocket: [20, 5, 1.1], tshell: [30, 12, 1.8], egren: [17, 0, 1], erocket: [16, 0, 1], ebomb: [17, 0, 1.1], eshell: [22, 0, 1.4], emissile: [16, 0, 1] }[b.kind];
    let floor = GROUND;
    if (b.kind === "gren" || b.kind === "egren") floor = floorAt(b.x, 1, b.y - b.vy * dt);
    if (b.y <= floor) {
      if (b.kind === "gren" && !b.bounced) { b.bounced = true; b.y = floor; b.vy = Math.abs(b.vy) * 0.35; b.vx *= 0.55; }
      else if (explosive) { b.dead = true; explode(b.x, Math.max(b.y, floor), explosive[0], explosive[1], b.team, explosive[2]); continue; }
      else if (b.kind !== "flame") { b.dead = true; part(b.x, GROUND + 1, 0, 20, 0.25, "#d8c8a0", 2, 0, "smoke"); continue; }
    }
    if (b.life <= 0 || b.x < camX - 40 || b.x > camX + W + 40 || b.y > H + 80) { b.dead = true; continue; }

    if (b.team === "p") {
      if (b.kind === "flame") {
        const r = 5 + (0.55 - b.life) * 16;
        for (const e of enemies) if (!e.dead && !b.hits.has(e) && distBox(b.x, b.y, ebox(e)) < r) { b.hits.add(e); damageEnemy(e, b.dmg, "flame", b.x); }
        for (const c of crates) if (!c.dead && !b.hits.has(c) && distBox(b.x, b.y, c) < r) { b.hits.add(c); damageCrate(c, b.dmg); }
        for (const br of barrels) if (!br.dead && !b.hits.has(br) && distBox(b.x, b.y, br) < r) { b.hits.add(br); damageBarrel(br, b.dmg); }
        for (const p of pows) if (p.state === "tied" && distBox(b.x, b.y, powBox(p)) < r) freePow(p);
        if (boss && !boss.dying && !boss.enter && !b.hits.has(boss) && distBox(b.x, b.y, bossBox()) < r) { b.hits.add(boss); damageBoss(b.dmg); }
        continue;
      }
      let hit = false;
      for (const m of bullets) if (m.kind === "emissile" && !m.dead && Math.hypot(m.x - b.x, m.y - b.y) < 7) { m.dead = true; boom(m.x, m.y, 0.7); sfx.boom(false); score += 50; popup(m.x, m.y + 8, "50"); hit = true; break; }
      if (!hit) for (const e of enemies) {
        if (e.dead || !inBox(ebox(e), b.x, b.y, b.r)) continue;
        damageEnemy(e, explosive ? 0 : b.dmg, "bullet", b.x - b.vx); hit = true; break;
      }
      if (!hit) for (const p of pows) if (p.state === "tied" && inBox(powBox(p), b.x, b.y, b.r)) { freePow(p); hit = true; break; }
      if (!hit) for (const c of crates) if (!c.dead && inBox(c, b.x, b.y, b.r)) { if (!explosive) damageCrate(c, b.dmg); hit = true; break; }
      if (!hit) for (const br of barrels) if (!br.dead && inBox(br, b.x, b.y, b.r)) { if (!explosive) damageBarrel(br, b.dmg); hit = true; break; }
      if (!hit && boss && !boss.dying && !boss.enter && inBox(bossBox(), b.x, b.y, b.r)) { if (!explosive) damageBoss(b.dmg); hit = true; }
      if (hit) {
        b.dead = true;
        if (explosive) explode(b.x, b.y, explosive[0], explosive[1], "p", explosive[2]);
        else sparks(b.x, b.y, 2, "#fff3a0", 70);
      }
    } else if (b.team === "e") {
      const box = P.inTank ? tankBox() : (P.dead ? null : pBox());
      if (box && inBox(box, b.x, b.y, 1)) {
        b.dead = true;
        if (explosive) explode(b.x, b.y, explosive[0], 0, "e", explosive[2]);
        else hurtTarget();
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);
}

function updatePows(dt) {
  for (const p of pows) {
    p.t += dt;
    if (p.state === "tied") {
      if (!P.dead && Math.abs(P.x - p.x) < 12 && P.y < p.y + 14) freePow(p);
    } else if (p.state === "free") {
      if (p.t > 0.5) { p.state = "walk"; p.t = 0; }
    } else if (p.state === "walk") {
      const d = P.x - p.x;
      p.face = d >= 0 ? 1 : -1;
      if (Math.abs(d) > 14 && p.t < 3) p.x += p.face * 60 * dt;
      else { p.state = "salute"; p.t = 0; dropItem(p.x + p.face * 6, p.y + 10, p.item); popup(p.x, p.y + 26, "¡GRACIAS!", "#fff"); sfx.thanks(); }
    } else if (p.state === "salute") {
      if (p.t > 0.8) { p.state = "run"; p.t = 0; p.face = -1; }
    } else if (p.state === "run") {
      p.x -= 130 * dt;
    }
  }
  pows = pows.filter(p => !(p.state === "run" && p.x < camX - 30));
}

function dropItem(x, y, kind) { items.push({ x, y, vy: 110, kind, t: 0 }); }
function updateItems(dt) {
  for (const it of items) {
    it.t += dt;
    const prevY = it.y;
    it.vy += GRAV * dt; it.y += it.vy * dt;
    const f = floorAt(it.x, 5, prevY);
    if (it.y <= f) { it.y = f; it.vy = 0; }
    if (!P.dead && Math.abs(it.x - P.x) < 11 && it.y < P.y + 22 && it.y + 12 > P.y) { pickup(it.kind); it.gone = true; }
  }
  items = items.filter(it => !it.gone && it.t < 15 && it.x > camX - 20);
}
function pickup(kind) {
  sfx.pick();
  if (WEAPONS[kind]) {
    const amt = Math.round(WEAPONS[kind].ammo * (hero.id === "ammo" ? 1.5 : 1));
    if (P.weapon === kind) P.ammo += amt;
    else { P.weapon = kind; P.ammo = amt; }
    announce(WEAPONS[kind].name); say(WEAPONS[kind].voice);
  } else if (kind === "B") {
    if (P.inTank && tank) { tank.shells += 10; announce("+10 PROYECTILES"); }
    else { P.bombs += 10; announce("+10 GRANADAS"); }
  } else { score += 500; popup(P.x, P.y + 26, "500", "#ffd34d"); }
}

function updateCrates(dt) {
  for (const c of crates) {
    c.flash = Math.max(0, c.flash - dt);
    if (c.dead) continue;
    let f = GROUND;
    for (const o of crates) if (o !== c && !o.dead && o.y < c.y && c.x + c.w > o.x + 1 && c.x < o.x + o.w - 1) f = Math.max(f, o.y + o.h);
    if (c.y > f) { c.vy += GRAV * dt; c.y = Math.max(f, c.y + c.vy * dt); if (c.y === f) c.vy = 0; }
  }
  crates = crates.filter(c => !c.dead && c.x > camX - 60);
  for (const b of barrels) {
    b.flash = Math.max(0, b.flash - dt);
    if (b.fuse > 0) { b.fuse -= dt; if (b.fuse <= 0 && !b.dead) { b.dead = true; explode(b.x + 6, b.y + 8, 38, 9, "p", 1.9); debris(b.x + 6, b.y + 8, 8, "#c03a28"); } }
  }
  barrels = barrels.filter(b => !b.dead && b.x > camX - 60);
}

function updateCamera(dt) {
  const focus = P.inTank && tank ? tank.x : P.x;
  let maxCam = LEVEL - W;
  if (lock) maxCam = Math.min(maxCam, lock.x);
  if (locks.length) maxCam = Math.min(maxCam, locks[0].x);
  const want = clamp(focus - W * 0.42, camX, maxCam);
  if (want > camX + 0.01 && !P.dead) { camX += Math.min(want - camX, 160 * dt); idleCam = 0; }
  else idleCam += dt;
}

function updateTimer(dt) {
  if (state !== "play" || P.dead || banner && banner.red) return;
  timeAcc += dt;
  if (timeAcc >= 2.2) {
    timeAcc = 0; timeLeft--;
    if (timeLeft <= 10 && timeLeft > 0) sfx.tick();
    if (timeLeft <= 0) { P.inv = 0; killPlayer(); timeLeft = 0; }
  }
}

function updateFx(dt) {
  for (const p of parts) {
    p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === "deb" && p.y < GROUND) { p.y = GROUND; p.vy = -p.vy * 0.35; p.vx *= 0.6; }
  }
  parts = parts.filter(p => p.life > 0);
  if (parts.length > 500) parts.splice(0, parts.length - 500);
  for (const b of booms) b.t += dt;
  booms = booms.filter(b => b.t < b.dur + 0.2);
  for (const b of blasts) b.t += dt;
  blasts = blasts.filter(b => b.t < 0.22);
  for (const p of popups) p.t += dt;
  popups = popups.filter(p => p.t < 0.9);
  for (const c of corpses) {
    c.t += dt;
    if (c.kind === "fly") { c.vy += GRAV * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += dt * 12 * c.face; if (c.y < GROUND) { c.y = GROUND; c.done = true; smoke(c.x, c.y + 3, 2, 3); } }
    else if (c.kind === "heli") {
      c.vy += GRAV * 0.5 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += dt * 3;
      if (Math.random() < 0.6) smoke(c.x, c.y, 1, 4);
      if (c.y < GROUND + 8) { c.done = true; explode(c.x, GROUND + 6, 34, 8, "p", 2.4); debris(c.x, GROUND + 8, 12, "#4a5528"); }
    } else if (c.kind === "fall") { if (c.t < 0.3) c.x += c.vx * dt; if (c.t > 1.4) c.done = true; }
    else if (c.kind === "burn") { if (Math.random() < 0.5 && c.t < 1) part(c.x + rand(-4, 4), c.y + rand(4, 20), 0, 30, 0.3, pick(["#ffd34d", "#ff8a1a"]), 2); if (c.t > 1.8) c.done = true; }
  }
  corpses = corpses.filter(c => !c.done);
  shake = Math.max(0, shake - dt * 14);
  if (announceMsg) { announceMsg.t += dt; if (announceMsg.t > 1.8) announceMsg = null; }
  if (banner) { banner.t += dt; if (banner.t > banner.dur) banner = null; }
  goT = Math.max(0, goT - dt);
}

function step(dt) {
  readInput();
  if (paused) return;
  stateT += dt;
  if (state === "title" || state === "select") { camX += 18 * dt; if (camX > LEVEL - W) camX = 0; updateFx(dt); return; }
  updateFx(dt);
  if (state === "play" || state === "complete") {
    updatePlayer(dt);
    if (state === "continue") return;
    updateTankObj(dt);
    activatePlaced();
    updateLocks(dt);
    trickleSpawn(dt);
    updateEnemies(dt);
    updateBoss(dt);
    updateBullets(dt);
    updatePows(dt);
    updateItems(dt);
    updateCrates(dt);
    updateCamera(dt);
    updateTimer(dt);
    if (state === "complete" && stateT > 5.5) { mission++; setupMission(); state = "play"; stateT = 0; }
  } else if (state === "continue") {
    const before = Math.ceil(contT);
    contT -= dt;
    if (Math.ceil(contT) !== before && contT > 0) sfx.tick();
    if (contT <= 0) {
      state = "over"; stateT = 0;
      if (score > highScore) { highScore = score; saveHS(score); }
      say("Game over");
    }
  }
}

// ---------- Rendering: pixel buffer ----------
const sx = x => Math.round(x - camX);
const sy = y => Math.round(H - y);
let SX = 0, SY = 0, SF = 1;
function org(x, y, f) { SX = Math.round(x); SY = Math.round(y); SF = f >= 0 ? 1 : -1; }
function R(x, y, w, h, c) { g.fillStyle = c; g.fillRect(SF > 0 ? SX + x : SX - x - w, SY - y - h, w, h); }
function circ(x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function ptext(t, x, y, c, size = 8, align = "center") {
  t = plain(t);
  g.font = `${size}px ${FONT}`; g.textAlign = align; g.textBaseline = "middle";
  g.fillStyle = "#000"; g.fillText(t, x + 1, y + 1);
  g.fillStyle = c; g.fillText(t, x, y);
}

function drawTrooper(c, o) {
  let base;
  if (o.crouch) {
    R(-5, 0, 4, 2, c.boot); R(2, 0, 5, 2, c.boot);
    R(-4, 2, 9, 3, c.pants); R(-4, 2, 3, 3, c.pantsD);
    base = 5;
  } else if (o.air) {
    R(-4, 4, 3, 4, c.pantsD); R(-5, 2, 3, 2, c.boot);
    R(1, 5, 4, 3, c.pants); R(3, 3, 3, 2, c.boot);
    base = 8;
  } else if (o.run != null) {
    const s = Math.sin(o.run * 13), a = Math.round(s * 3), b = -a;
    const lift = v => v > 1 ? 1 : 0;
    R(-2 + b, 2 + lift(b), 3, 6 - lift(b), c.pantsD); R(-3 + b, lift(b), 4, 2, c.boot);
    R(-1 + a, 2 + lift(a), 3, 6 - lift(a), c.pants); R(-1 + a, lift(a), 4, 2, c.boot);
    base = 8 + (Math.abs(s) < 0.5 ? 1 : 0);
  } else {
    R(-3, 2, 3, 6, c.pantsD); R(0, 2, 3, 6, c.pants); R(-4, 0, 4, 2, c.boot); R(0, 0, 4, 2, c.boot);
    base = 8 + (o.bob ? (Math.sin(clock * 4 + (o.seed || 0)) > 0.6 ? 1 : 0) : 0);
  }
  // torso
  if (o.pack) { R(-7, base + 1, 3, 6, c.topD); R(-7, base + 6, 3, 1, c.belt); }
  R(-4, base, 8, 7, c.top); R(-4, base, 2, 7, c.topD); R(-4, base + 1, 8, 1, c.belt);
  // head
  const hb = base + 7;
  R(-3, hb, 6, 5, c.skin); R(1, hb + 2, 1, 2, c.eye);
  if (o.hat === "band") {
    R(-3, hb + 4, 6, 2, c.hair); R(-3, hb + 1, 1, 4, c.hair);
    R(-3, hb + 3, 6, 1, c.hat); R(-5, hb + 2, 2, 1, c.hat);
    R(-6, hb + 1 + (o.run != null && Math.sin(o.run * 13) > 0 ? 1 : 0), 1, 1, c.hat);
  } else if (o.hat === "pony") {
    R(-3, hb + 4, 6, 2, c.hair); R(-3, hb + 1, 1, 4, c.hair); R(-3, hb + 3, 6, 1, c.hat);
    R(-6, hb + 1 + (o.run != null && Math.sin(o.run * 13) > 0 ? 1 : 0), 3, 3, c.hair);
  } else if (o.hat === "cap") {
    R(-4, hb, 2, 5, c.hair); R(-3, hb + 3, 6, 3, c.hat); R(-3, hb + 5, 6, 1, c.hatD); R(3, hb + 3, 3, 1, c.hatD);
  } else if (o.hat === "pow") {
    R(-3, hb + 4, 6, 2, c.hair); R(-4, hb + 1, 1, 4, c.hair); R(-3, hb, 5, 2, c.hair);
  } else {
    R(-4, hb + 3, 8, 3, c.hat); R(-3, hb + 6, 6, 1, c.hat); R(-4, hb + 3, 8, 1, c.hatD); R(3, hb + 3, 2, 1, c.hatD);
  }
  if (o.glasses) R(0, hb + 2, 3, 1, "#1a1a1a");
  // arms + weapon
  const sh = base + 4;
  if (o.salute) { R(0, sh, 2, 3, c.top); R(1, sh + 3, 2, 4, c.top); R(2, hb + 2, 2, 2, c.skin); return; }
  if (o.knife) { R(0, sh, 6, 2, c.top); R(6, sh, 2, 2, c.skin); R(8, sh + 1, 6, 1, "#dfe7ef"); R(8, sh, 1, 3, "#555"); return; }
  if (o.throwArm) { R(-3, sh + 1, 2, 6, c.top); R(-3, sh + 7, 2, 2, c.skin); R(-4, sh + 9, 3, 3, "#3c4a2a"); return; }
  const gun = o.gun;
  if (gun === "none") { R(0, sh - 3, 2, 5, c.top); R(0, sh - 4, 2, 1, c.skin); return; }
  if (gun === "flail") { const k = Math.sin(clock * 30) > 0 ? 2 : 0; R(1, sh + 1, 2, 6 + k, c.top); R(1, sh + 7 + k, 2, 2, c.skin); return; }
  if (gun === "bazooka") { R(-7, sh + 1, 18, 3, "#4f5f2c"); R(-7, sh + 1, 2, 3, "#2a2a2a"); R(9, sh + 1, 2, 3, "#2a2a2a"); R(1, sh - 1, 3, 2, c.skin); return; }
  if (gun === "knifeIdle") { R(0, sh - 3, 2, 5, c.top); R(0, sh - 4, 2, 1, c.skin); R(1, sh - 9, 1, 5, "#dfe7ef"); return; }
  const len = { pistol: 5, rifle: 9, H: 10, S: 9, R: 10, F: 9 }[gun] || 6;
  if (o.aim === "u") {
    R(0, sh, 3, 5, c.top); R(0, sh + 5, 3, 2, c.skin); R(0, sh + 6, 3, len, c.gun); R(1, sh + 6, 1, len, c.gunL);
    if (gun === "R") R(-1, sh + 6, 5, len, "#556b2f");
  } else if (o.aim === "d") {
    R(0, sh - 4, 3, 5, c.top); R(0, sh - 6, 3, 2, c.skin); R(0, sh - 6 - len, 3, len, c.gun);
  } else {
    R(0, sh, 5, 2, c.top); R(5, sh, 2, 2, c.skin);
    R(4, sh + 1, len, 2, c.gun); R(5, sh + 2, len - 2, 1, c.gunL);
    if (gun === "H") { R(6, sh - 2, 3, 3, "#2a2a2a"); R(4 + len, sh + 1, 1, 2, "#2a2a2a"); }
    if (gun === "R") { R(3, sh, len + 1, 4, "#556b2f"); R(3 + len, sh, 1, 4, "#2a2a2a"); }
    if (gun === "F") { R(7, sh - 2, 3, 3, "#c86a2a"); R(4 + len, sh, 1, 3, "#ffb24a"); }
    if (gun === "S") { R(4, sh + 1, len, 3, "#5a3a1a"); R(4 + len - 3, sh + 2, 3, 2, c.gun); }
    if (gun === "rifle") R(1, sh, 3, 2, "#6a4a2a");
  }
}

function drawPlayer() {
  if (P.inTank) return;
  if (P.inv > 0 && !P.dead && Math.floor(clock * 20) % 2) return;
  if (P.dead) {
    if (P.deadT > 1.3 && Math.floor(clock * 16) % 2) return;
    g.save(); g.translate(sx(P.x), sy(P.y));
    g.rotate(-P.face * Math.min(P.deadT * 4, 1) * Math.PI / 2);
    org(0, 0, P.face);
    drawTrooper(hero.pal, { hat: hero.hat, glasses: hero.glasses, gun: "flail", air: P.deadT < 0.4, pack: true });
    g.restore();
    return;
  }
  org(sx(P.x), sy(P.y), P.face);
  drawTrooper(hero.pal, {
    run: P.moving ? P.runT : null, crouch: P.crouch, air: !P.onGround, aim: P.aim, hat: hero.hat, glasses: hero.glasses, pack: true,
    knife: P.knifeT > 0, throwArm: P.throwT > 0, gun: P.weapon === "P" ? "pistol" : P.weapon,
  });
}

function drawEnemy(e) {
  if (e.type === "heli") return drawHeli(e);
  if (e.type === "truck") return drawTruck(e);
  org(sx(e.x), sy(e.y), e.face);
  const pal = e.flash > 0 ? PAL_W : PAL_E;
  if (e.para && e.y > GROUND + 1) {
    R(-11, 32, 22, 5, "#e8e0c8"); R(-9, 37, 18, 2, "#e8e0c8"); R(-11, 32, 4, 5, "#c83a2a"); R(7, 32, 4, 5, "#c83a2a");
    R(-10, 24, 1, 8, "#5a5a5a"); R(9, 24, 1, 8, "#5a5a5a");
  }
  const sleeping = e.state === "idle" && e.idleKind === "sleep";
  let gun = { rifle: "rifle", grenadier: "none", knife: "knifeIdle", bazooka: "bazooka", shield: "none" }[e.type];
  if (e.state === "alert" || e.panic > 0) gun = "flail";
  drawTrooper(pal, {
    run: e.moving ? e.anim : null, crouch: e.crouch || sleeping, air: e.y > (e.plat ? e.plat.y : GROUND) + 1 && !e.para, aim: "f", gun,
    knife: e.atkT > 0, throwArm: e.throwT > 0, hat: "helmet", bob: e.state === "idle" && !sleeping, seed: e.anim,
  });

    T("ELIGE TU SOLDADO", W / 2, 22, 10, gold, "center");
    for (let i = 0; i < 4; i++) {
      const c = CARD(i), sel = i === heroIdx, h = HEROES[i], cx = c.x + c.w / 2;
      ctx.strokeStyle = sel ? gold : "rgba(255,255,255,0.3)"; ctx.lineWidth = sel ? 2 : 1;
      ctx.strokeRect(c.x + 0.5, c.y + 0.5, c.w - 1, c.h - 1);
      T(h.name, cx, c.y + c.h - 26, 8, sel ? gold : "#fff", "center");
      T(h.perk, cx, c.y + c.h - 11, 4.5, "#cfc3b0", "center");
    }
    if (Math.floor(clock * 2.5) % 2) T(touchUI ? "TOCA UN SOLDADO" : "← →  ELEGIR   ·   ENTER  JUGAR", W / 2, 180, 7, "#fff", "center");
    drawMute();
    return;
  }
  if (state === "continue") {
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, W, H);
    T("¿CONTINUAR?", W / 2, H / 2 - 36, 16, gold, "center");
    T(String(Math.max(0, Math.ceil(contT))), W / 2, H / 2 + 4, 30, "#fff", "center");
    if (Math.floor(clock * 3) % 2) T(touchUI ? "TOCA PARA SEGUIR" : "PULSA UNA TECLA", W / 2, H / 2 + 40, 8, "#fff", "center");
    T(`PUNTOS ${score}`, W / 2, H / 2 + 60, 6, "#e8e0c8", "center");
    return;
  }
  if (state === "over") {
    ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(0, 0, W, H);
    T("GAME OVER", W / 2, H / 2 - 30, 22, "#ff4a3a", "center");
    T(`PUNTOS ${score}`, W / 2, H / 2 + 6, 9, "#fff", "center");
    T(`RÉCORD ${highScore}   ·   POW ${powSaved}`, W / 2, H / 2 + 24, 6, "#e8e0c8", "center");
    if (stateT > 1 && Math.floor(clock * 2.5) % 2) T(touchUI ? "TOCA PARA VOLVER" : "PULSA UNA TECLA", W / 2, H / 2 + 48, 8, gold, "center");
  }
}

function render(dt) {
  drawWorld(dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  if (state === "title" || state === "select") { drawOverlay(); return; }
  drawHUD();
  if (!paused) drawBanner();
  drawControls();
  drawOverlay();
  if (paused) {
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, W, H);
    T("PAUSA", W / 2, H / 2 - 18, 18, "#ffd34d", "center");
    T(touchUI ? "TOCA PARA SEGUIR" : "P / ENTER PARA SEGUIR", W / 2, H / 2 + 14, 8, "#fff", "center");
    drawMute();
  }
}

const isInstalled = () => matchMedia("(display-mode: fullscreen)").matches || matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

// ---------- Boot ----------
P = mkPlayer(80);
buildBackdrop();
let last = 0;
function frame(t) {
  let dt = last ? Math.min((t - last) / 1000, 1 / 30) : 0;
  last = t;
  if (slowT > 0 && !paused) { slowT -= dt; dt *= 0.3; }
  if (paused) dt = 0;
  clock += dt;
  step(dt);
  render(dt);
  musicTick();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__slugger = {
  get state() { return { state, score, lives, mission, camX: Math.round(camX), px: Math.round(P.x), weapon: P.weapon, enemies: enemies.length, boss: !!boss, lock: !!lock, inTank: P.inTank, pows: powSaved }; },
};
})();
</script>
<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
